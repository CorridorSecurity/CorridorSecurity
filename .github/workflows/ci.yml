name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell-parse:
    name: PowerShell parse check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Parse-check PowerShell MDM scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path mdm -Filter *.ps1 -Recurse -File
          if (-not $files) {
            Write-Host 'No PowerShell scripts found under mdm/.'
            exit 0
          }

          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($err in $errors) {
                Write-Host "::error file=$($file.FullName),line=$($err.Extent.StartLineNumber)::$($err.Message)"
              }
            } else {
              Write-Host "OK: $($file.FullName)"
            }
          }

          if ($failed) { exit 1 }

  generated-scripts:
    name: Generated MDM scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generated scripts are up to date
        run: scripts/build.sh --check

      - name: Syntax check
        run: |
          for f in mdm/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck -S warning mdm/*-macos.sh
